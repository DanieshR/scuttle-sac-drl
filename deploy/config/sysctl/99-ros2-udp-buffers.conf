# 99-ros2-udp-buffers.conf — enlarge UDP socket buffers for ROS 2 over WiFi.
#
# Install on BOTH machines (Pi and base station):
#   sudo cp 99-ros2-udp-buffers.conf /etc/sysctl.d/
#   sudo sysctl --system            # apply without reboot
# Verify:
#   sysctl net.core.rmem_max net.core.wmem_max
#
# Why: DDS and zenoh burst large messages (the /map OccupancyGrid especially).
# The default ~208 KB socket buffer overflows on a congested hotspot link,
# silently dropping datagrams — which surfaces as "missing /map updates" or a
# stuttering TF rather than an obvious error. 16 MB is generous headroom for a
# single robot + base station and costs nothing when idle.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216
