# chrony-basestation.conf — base station acts as the LOCAL NTP server for the robot.
#
# Install on the BASE STATION (this laptop):
#   sudo cp chrony-basestation.conf /etc/chrony/conf.d/ros2-offload.conf
#   sudo systemctl restart chrony
# Verify (on the base station): chronyc tracking ; chronyc clients
#
# Goal: Pi and base station must agree on time. Absolute correctness matters less
# than the two machines being locked to ONE clock — a skew between them looks
# exactly like network latency and produces TF/SLAM bugs that waste hours.

# Use internet NTP when the hotspot has working cellular upstream (best accuracy).
pool 2.pool.ntp.org iburst maxsources 4

# Serve time to the hotspot clients. Both /24s the robot might appear on are
# allowed (10.118.109.0/24 = phone hotspot, 192.168.155.0/24 = direct ethernet).
# Tighten these to your actual subnet if you prefer.
allow 10.118.109.0/24
allow 192.168.155.0/24

# CRITICAL: keep serving time even with NO upstream (hotspot cellular down, or
# offline bench testing). Without this, chrony refuses to be a server until it
# locks to a pool, and the Pi never syncs. stratum 10 is low enough to never
# override a real upstream when one is available.
local stratum 10 orphan

# Allow large initial corrections quickly, then discipline normally.
makestep 1.0 3
rtcsync
driftfile /var/lib/chrony/chrony.drift
