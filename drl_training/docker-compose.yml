version: '3.8'
services:
  drl_training:
    build: .
    container_name: drl_scuttle_training
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - .:/home/turtlebot3_drlnav
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    stdin_open: true
    tty: true
    entrypoint: /home/turtlebot3_drlnav/entrypoint.sh
    command: bash
